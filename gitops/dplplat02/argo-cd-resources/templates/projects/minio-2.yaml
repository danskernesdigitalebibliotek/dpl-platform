apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: minio-2
spec:
  destinations:
    - name: in-cluster
      namespace: minio-2
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  sourceRepos:
    - https://github.com/danskernesdigitalebibliotek/dpl-platform.git # git repository
